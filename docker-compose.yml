name: secure-messaging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_messaging}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    # Bind to loopback by default — never expose Postgres on all interfaces in production.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-secure_messaging}']
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Set REDIS_PASSWORD in production and mirror it in REDIS_URL (redis://:pass@redis:6379).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    # Bind to loopback by default — Redis must not be internet-facing.
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://app:app@postgres:5432/secure_messaging}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: sh -c "npx prisma db push && npm run start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app_net
    volumes:
      - backend_media:/app/backend/storage/media

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:3000/realtime}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_media:
