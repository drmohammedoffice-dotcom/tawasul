apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: messaging-frontend
  template:
    metadata:
      labels:
        app: messaging-frontend
    spec:
      containers:
        - name: frontend
          image: secure-messaging/frontend:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-frontend
spec:
  selector:
    app: messaging-frontend
  ports:
    - port: 5173
      targetPort: 5173
